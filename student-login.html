<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AYLI Student Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                AYLI
            </div>

            <h1>Student Login</h1>

            <p class="login-subtitle">
                Africa Youth Leadership Institute
            </p>

            <form id="studentLoginForm">

                <div class="form-group">

                    <label for="ayliId">
                        AYLI Student ID
                    </label>

                    <input
                        type="text"
                        id="ayliId"
                        placeholder="Example: AYLI-C12-002"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="studentPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="studentPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="login-button">
                    Login
                </button>

                <p id="studentLoginMessage"></p>

            </form>

            <div class="login-footer">

                <p>
                    Africa Youth Leadership Institute (AYLI)
                </p>

                <p>
                    Leadership School Management System
                </p>

                <p>
                    <a href="login.html">
                        Administrator Login
                    </a>
                </p>

            </div>

        </div>

    </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="Js/student-auth.js"></script>
</body>

</html>
